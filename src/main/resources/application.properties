spring.config.import=optional:file:env.properties
spring.application.name=PistakioGelatoBE
server.port=${PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
#STRIPE
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.success-url=${PAYMENT_SUCCESS_URL}
stripe.cancel-url=${PAYMENT_CANCEL_URL}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}
#BREVO
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
#CLOUDINARY
CLOUDINARY_URL=cloudinary://${CLOUDINARY_APIKEY}:${CLOUDINARY_SECRET}@sejcn1v6
cloudinary.name=${CLOUDINARY_NAME}
cloudinary.api.secret=${CLOUDINARY_SECRET}
cloudinary.api.key=${CLOUDINARY_APIKEY}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
#PAYPAL
paypal.client-id=${PAYPAL_ID}
paypal.client-secret=${PAYPAL_SECRET}
paypal.base-url=${PAYPAL_URL}
paypal.success-url=${PAYMENT_SUCCESS_URL}
paypal.cancel-url=${PAYMENT_CANCEL_URL}
#RESETPW
frontend.url=${FRONTEND_URL}